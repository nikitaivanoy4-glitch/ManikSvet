# Railway.app deployment configuration
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"

[deploy]
startCommand = "PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
