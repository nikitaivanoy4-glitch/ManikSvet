services:
  - type: web
    name: manik-drojjino-bot
    env: python
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        value: "[708192421]"
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:////data/manik_svet.db"
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: db-storage
      mountPath: /data
      sizeGB: 1
